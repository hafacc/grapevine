name: deploy web

# By hand, from main, and nothing else. Not on a published Release: a release
# runs on its tag, and the `github-pages` environment accepts deploys from main
# only, so the run would apply the migrations and replace both functions, and
# then be refused at the last job, leaving the database ahead of a site stuck
# on the last good version.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Before the site, so a deploy can never publish a frontend expecting a policy
  # or a function that isn't live yet. If this job fails, Pages never runs and the
  # site stays on the last good version.
  #
  # Long-lived secrets: Supabase has no equivalent of workload identity
  # federation, so `db push`, `config push` and `functions deploy` authenticate
  # with a personal access token and the database password, and `config push` needs the Google OAuth
  # client's id and secret because `config.toml` names them as `env(...)`.
  # CLAUDE.md, "Supabase setup", is where they come from.
  supabase:
    needs: ci
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_GOOGLE_CLIENT_ID }}
      SUPABASE_AUTH_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_GOOGLE_SECRET }}
      # A repository *variable*, not a secret: the project ref is in every URL
      # the app talks to. It lives here rather than in the file so that a fork,
      # or a second project, needs no diff.
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      # Before anything that writes. An unset secret is an empty string to
      # every step below, and none of them refuses one: `config push` with the
      # Google pair empty pushes an empty client and turns off the only way in.
      # A branch other than main gets as far as the Pages job and no further,
      # which is the same half-release as above.
      - name: refuse a missing secret or a branch other than main
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD \
            SUPABASE_AUTH_GOOGLE_CLIENT_ID SUPABASE_AUTH_GOOGLE_SECRET \
            SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::not set:$missing"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::deploys run from main only, not $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@v7

      # Pinned, and pinned to the same version ci.yml runs the suites under:
      # this is the step that applies forward-only migrations to real data, and
      # `latest` would make the tool that does it the one unreviewed input to a
      # deploy.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Each Edge Function reads the core's `.wasm` from beside its entry point,
      # and `functions deploy` uploads it only because `config.toml`'s
      # `static_files` names it per function — it is read, not imported, so the
      # bundler would not find it on its own. The `web` target is built here
      # rather than downloaded, because a stale core is worse than the minute
      # this costs.
      - run: rustup show active-toolchain || rustup toolchain install
        working-directory: rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - run: bash scripts/build-wasm.sh web

      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Read-only, and printed before the two steps below write anything: which
      # migrations are about to be applied and which settings are about to
      # change. A run that went wrong is read back from these lines.
      - run: supabase db push --dry-run

      - run: supabase config diff --project-ref "$SUPABASE_PROJECT_REF"

      # Forward-only, against real data, with no snapshot behind it on the free
      # tier: `db push` applies the migrations that have not been applied and
      # there is no command that undoes one. A migration that drops or rewrites a
      # column is reviewed as the irreversible thing it is.
      - run: supabase db push

      # `db push` applies migrations and nothing else: Google as the only
      # provider, anonymous sign-ins off, email signup off, email changes
      # confirmed at both ends, `site_url` and the redirect allow-list reach the
      # project only through this. Without it they are a file that describes a
      # project nobody configured. `--yes` because each changed service asks
      # for confirmation, and an unanswered prompt on a runner is a refusal.
      - run: supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes

      # Unconditional, like the migrations: working out whether a function
      # changed since the last release is more trouble than deploying it.
      # `--use-api` bundles on Supabase's side, as a deploy from a machine with
      # no Docker does; without it the runner's Docker would bundle them a
      # second, untried way.
      - run: supabase functions deploy refresh-recs --use-api --project-ref "$SUPABASE_PROJECT_REF"

      - run: supabase functions deploy refresh-suggestions --use-api --project-ref "$SUPABASE_PROJECT_REF"

  build:
    needs: supabase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - run: bun export

      # Turns Pages on if it isn't already, so the first deploy doesn't fail on
      # an unclicked setting. Needs the repo to be Pages-eligible: public, on a
      # free org plan.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
